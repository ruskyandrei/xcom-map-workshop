# Publishes the user guide as a page (GitHub Pages): tools/release/guide/guide.html made one page, with its pictures
# inside it and the version filled in, by tools/viewer/guide.py, as a release carries it.
name: Guide page

on:
  push:
    branches: [main]
    paths:
      - tools/release/guide/**
      - tools/viewer/guide.py
      - tools/viewer/version.py
      - .github/workflows/guide.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make the guide one page
        run: |
          mkdir _site
          cd tools/viewer
          python -c "import guide, pathlib; pathlib.Path('../../_site/index.html').write_bytes(guide.inline())"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
